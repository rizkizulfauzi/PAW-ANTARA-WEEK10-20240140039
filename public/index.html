<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat With AI</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen">

  <div class="max-w-5xl mx-auto h-screen flex flex-col bg-white shadow-xl">

    <!-- HEADER -->
    <header class="bg-blue-600 text-white px-6 py-5 flex items-center justify-between">

      <div>
        <h1 class="text-2xl font-bold">
          🤖 Chat With AI
        </h1>

        <p class="text-blue-100 text-sm mt-1">
          Tanya produk kepada AI
        </p>
      </div>

      <button
        id="historyBtn"
        class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-blue-50 transition"
      >
        📜 Riwayat
      </button>

    </header>


    <!-- CHAT AREA -->
    <main
      id="chatBox"
      class="flex-1 overflow-y-auto p-6 space-y-5 bg-slate-50"
    >

      <!-- PESAN AWAL -->
      <div class="flex items-start gap-3">

        <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center">
          🤖
        </div>

        <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm max-w-[75%]">
          <p class="text-slate-700">
            Halo! 👋 Ada yang bisa saya bantu?
          </p>
        </div>

      </div>

    </main>


    <!-- INPUT -->
    <footer class="border-t border-slate-200 bg-white p-5">

      <div class="flex gap-3">

        <input
          id="messageInput"
          type="text"
          placeholder="Ketik pesan kamu..."
          autocomplete="off"
          class="flex-1 border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >

        <button
          id="sendBtn"
          class="bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-blue-700 transition disabled:bg-slate-400"
        >
          Kirim
        </button>

      </div>


      <!-- SAVE HISTORY -->
      <label class="flex items-center gap-2 mt-3 text-sm text-slate-600 cursor-pointer">

        <input
          id="saveHistory"
          type="checkbox"
          class="w-4 h-4 accent-blue-600"
        >

        <span>
          Simpan riwayat percakapan
        </span>

      </label>


      <p
        id="status"
        class="text-xs text-slate-500 mt-2"
      ></p>

    </footer>

  </div>


  <!-- MODAL HISTORY -->

  <div
    id="historyModal"
    class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4"
  >

    <div
      class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col"
    >

      <!-- MODAL HEADER -->

      <div class="flex items-center justify-between p-5 border-b">

        <div>
          <h2 class="text-xl font-bold text-slate-800">
            📜 Riwayat Percakapan
          </h2>

          <p class="text-sm text-slate-500 mt-1">
            Percakapan yang telah kamu simpan
          </p>
        </div>

        <button
          id="closeHistoryBtn"
          class="text-slate-500 hover:text-red-500 text-xl"
        >
          ✕
        </button>

      </div>


      <!-- HISTORY LIST -->

      <div
        id="historyList"
        class="overflow-y-auto p-5 space-y-3"
      >

        <p class="text-center text-slate-500">
          Memuat riwayat...
        </p>

      </div>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
